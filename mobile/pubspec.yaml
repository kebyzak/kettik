name: kettik
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf

# Regenerate with `dart run flutter_launcher_icons` after changing branding/*.svg and re-rendering the PNGs.
flutter_launcher_icons:
  image_path: branding/icon.png
  android: true
  adaptive_icon_background: "#282C29"
  adaptive_icon_foreground: branding/foreground.png
  adaptive_icon_monochrome: branding/foreground.png
  ios: true
  remove_alpha_ios: true
# The generator rewrites ios/Runner.xcodeproj/project.pbxproj wrongly; revert that file after running it.
